name: Update app automatically

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: preview

  publish_release:
    name: Publish release and notify
    needs: [build_android]
    # Publish + notify only on version tags (e.g. v2.1.0). Ordinary pushes to
    # main still build, but don't spam everyone with an "update available" push.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Injects EAS environment variables (PUBLISH_RELEASE_SECRET) into the shell.
    environment: production
    steps:
      - name: Publish release and notify
        run: |
          set -euo pipefail
          BUILD_ID="${{ needs.build_android.outputs.build_id }}"
          VERSION="${{ needs.build_android.outputs.app_version }}"

          # The APK download URL isn't exposed as a build-job output, and the
          # `eas` CLI isn't available inside workflow run steps. So we hand the
          # build_id to the edge function, which resolves the artifact URL via
          # the Expo GraphQL API server-side. build_id/version are safe to
          # interpolate directly (a UUID and a semver string).
          echo "Publishing version $VERSION (build $BUILD_ID)"
          curl -fsS -X POST \
            "https://lidtkayomwohylmiiqss.supabase.co/functions/v1/publish-release" \
            -H "Content-Type: application/json" \
            -H "x-publish-secret: $PUBLISH_RELEASE_SECRET" \
            -d "{\"version\":\"${VERSION}\",\"build_id\":\"${BUILD_ID}\"}"
